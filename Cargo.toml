[workspace]
resolver = "3"
members = [
    "crates/fixpt-hash",
    "crates/fixpt-memmgmt",
    "crates/fixpt-heap",
    "crates/fixpt-read",
    "crates/fixpt-core",
    "crates/fixpt-runtime",
    "crates/fixpt-scheme",
    "crates/fixpt-engine",
    "crates/fixpt-cli",
    "crates/fixpt-conform",
    "crates/fixpt-fx91",
    "crates/fixpt-fx87",
    "crates/fixpt-fx26",
    "crates/fixpt-tidy",
    "crates/fixpt-tools",
    "crates/fixpt-native",
    "crates/fixpt-reps",
]
# All but the tools' binaries, which have no tests: so that `cargo run`
# finds one binary, `fixpt`, and starts the FX-26 REPL. The tools are
# `cargo run -p fixpt-tools --bin sexp-edit` (or `fixpt-symbolize`).
default-members = [
    "crates/fixpt-hash",
    "crates/fixpt-memmgmt",
    "crates/fixpt-heap",
    "crates/fixpt-read",
    "crates/fixpt-core",
    "crates/fixpt-runtime",
    "crates/fixpt-scheme",
    "crates/fixpt-engine",
    "crates/fixpt-cli",
    "crates/fixpt-conform",
    "crates/fixpt-fx91",
    "crates/fixpt-fx87",
    "crates/fixpt-fx26",
    "crates/fixpt-tidy",
    "crates/fixpt-native",
    "crates/fixpt-reps",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pnkfelix/fixpt"

[workspace.lints.rust]
unsafe_code = "deny"

# Release speed with the checks a debug build has: `debug_assert!`s and
# arithmetic overflow panics (`cargo test --profile checked`). The suite
# runs in about release's time, so nothing waits on an unoptimized build.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# The heap, collector and all, optimized in a debug build (the user's,
# 2026-11-12, TODO §252): its checks kept, as a package's own setting
# leaves them (`fixpt-runtime`'s `tests/checks.rs` holds that it does).
[profile.dev.package.fixpt-heap]
opt-level = 1

# The FX-26 front end likewise (the user's, 2026-11-13): it reads its
# syntax through the heap's lendings and accessors, which unoptimized
# cost the bootstrap program's check 40 s against 15 s at opt-level 1.
[profile.dev.package.fixpt-fx26]
opt-level = 1
